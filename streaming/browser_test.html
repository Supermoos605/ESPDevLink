<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESPLink WebRTC Test</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;background:#111;color:#eee}video{width:100%;background:#000;border-radius:12px}button{padding:10px 16px;margin:8px 8px 8px 0;border:0;border-radius:8px;cursor:pointer}pre{background:#1d1d1d;padding:12px;border-radius:8px;overflow:auto}
</style>
</head>
<body>
<h1>ESPLink WebRTC Test</h1>
<p>This page is a signaling/connection test. It does not capture or stream a game yet.</p>
<button id="reset">Reset session</button>
<button id="refresh">Refresh state</button>
<video id="remote" autoplay playsinline controls></video>
<pre id="state">Waiting...</pre>
<script>
const base = location.protocol + '//' + location.hostname + ':8765';
const out = document.getElementById('state');
const remote = document.getElementById('remote');
async function api(path, options={}) {
  const r = await fetch(base + path, options);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function refresh() {
  try { out.textContent = JSON.stringify(await api('/api/signaling/state'), null, 2); }
  catch(e) { out.textContent = 'Signaling server unavailable: ' + e.message; }
}
document.getElementById('refresh').onclick = refresh;
document.getElementById('reset').onclick = async () => {
  await api('/api/signaling/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  refresh();
};
refresh();
</script>
</body>
</html>
