<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0f"><title>ESPLink · Stream</title><script src="/auth.js"></script><style>:root{font-family:Inter,system-ui,sans-serif;color:#f5f7fb;background:#080a0f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,#17213a 0,#0d111b 30%,#080a0f 70%);overflow:hidden}.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.2;pointer-events:none}.one{width:260px;height:260px;background:#496cff;top:-120px;right:-70px}.two{width:220px;height:220px;background:#8d4cff;bottom:-120px;left:-70px}.shell{position:relative;width:100%;height:100vh;height:100dvh;padding:14px;display:flex;flex-direction:column;gap:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#6d7cff,#8d50ff);display:grid;place-items:center}.logo:before{content:"";width:15px;height:15px;border:3px solid white;border-radius:5px}.title{font-weight:800;font-size:16px}.meta{font-size:11px;color:#778196;margin-top:2px}.live{display:flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid #ffffff12;border-radius:999px;background:#ffffff08;color:#aeb7c8;font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:#49e39b;box-shadow:0 0 10px #49e39b}.stage{position:relative;flex:1;min-height:0;border:1px solid #ffffff12;border-radius:22px;background:#05070bdf;box-shadow:0 25px 70px #00000050;display:flex;align-items:center;justify-content:center;overflow:hidden}.stage video{width:100%;height:100%;object-fit:contain;background:#030407}.placeholder{text-align:center;padding:25px;color:#7d8799}.placeholder .screen{width:68px;height:48px;border:2px solid #56617a;border-radius:9px;margin:0 auto 15px;position:relative}.placeholder .screen:after{content:"";position:absolute;left:50%;bottom:-8px;width:24px;height:2px;background:#56617a;transform:translateX(-50%)}.placeholder strong{display:block;color:#d9deea;margin-bottom:5px}.controls{display:flex;align-items:center;justify-content:space-between;gap:10px}.control{border:1px solid #ffffff12;background:#ffffff08;color:#dce2ed;border-radius:14px;padding:11px 14px;font-weight:700;cursor:pointer}.disconnect{background:linear-gradient(135deg,#5d6eff,#8b52ff);border:0}.footer{font-size:10px;color:#596477;text-align:center}.diag-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;color:#aeb7c8;font-size:11px}.diag-head span{font-family:ui-monospace,monospace;color:#69748a}.diag-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}.diag-grid div{min-width:0;padding:7px 8px;border:1px solid #ffffff0d;border-radius:10px;background:#ffffff06}.diag-grid span{display:block;color:#667188;font-size:9px;margin-bottom:3px}.diag-grid b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;font-family:ui-monospace,monospace;color:#dce2ed}.diag-head strong{font-size:11px;color:#dce2ed}.diag-head span{font-size:9px}.controls+ .footer{margin-top:0}@media(max-width:650px){.shell{padding:9px}.stage{border-radius:17px}.control{padding:10px 11px;font-size:11px}.footer{display:none}.diag-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.diag-grid div{padding:6px}.diag-grid span{font-size:8px}.diag-grid b{font-size:9px}}@media(max-height:650px){.diag-grid div{padding:5px}.diag-head{margin-bottom:4px}}@media(max-height:520px) and (orientation:landscape){.shell{padding:7px}.stage{border-radius:14px}.footer{display:none}.diag-grid{grid-template-columns:repeat(6,minmax(0,1fr))}.diag-grid div{padding:4px}.diag-grid span{display:none}}</style></head><body><div class="orb one"></div><div class="orb two"></div><main class="shell"><header class="top"><div class="brand"><div class="logo"></div><div><div class="title">ESPLink</div><div class="meta" id="hostMeta">Preparing session</div></div></div><div class="live"><i class="dot"></i><span id="state">READY</span></div></header><section class="stage"><video id="stream" autoplay playsinline></video><div class="placeholder" id="placeholder"><div class="screen"></div><strong id="gameName">Stream ready</strong><span id="gameHint">Connect to the host to begin.</span></div></section><nav class="controls"><button class="control" onclick="location.href='/games.html'">← Games</button><div><button class="control" id="settings">⚙ Settings</button><button class="control disconnect" id="disconnect">Disconnect</button></div></nav><div class="footer">ESPLink · Browser-based PC streaming</div></main><script src="/stream.js"></script></body></html>
