<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0f"><title>ESPLink · Authorization</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#f5f7fb;background:#080a0f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 20% 10%,#17213a,#0d111b 35%,#080a0f 75%)}.card{width:min(430px,100%);padding:30px 22px;border:1px solid #ffffff12;border-radius:24px;background:#ffffff08;box-shadow:0 30px 80px #0008}.brand{display:flex;align-items:center;gap:11px;margin-bottom:26px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#6d7cff,#8d50ff);display:grid;place-items:center}.logo:before{content:"";width:17px;height:17px;border:3px solid white;border-radius:6px}.brand strong{font-size:20px}.brand small{display:block;color:#7f899c;margin-top:2px}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#8995ad}h1{font-size:30px;letter-spacing:-1px;margin:8px 0}p{font-size:13px;line-height:1.55;color:#9ca6b8}label{display:block;margin:20px 0 7px;color:#c8cfdd;font-size:12px;font-weight:700}input{width:100%;padding:14px;border:1px solid #ffffff14;border-radius:13px;background:#07090e;color:white;outline:none;font-size:15px}input:focus{border-color:#7886ff}button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#6476ff,#9257ff);color:white;font-weight:800;cursor:pointer}.error{min-height:18px;color:#ff7d8b;font-size:11px;margin-top:10px}.note{text-align:center;color:#596477;font-size:10px;margin-top:18px}</style></head><body><main class="card"><header class="brand"><div class="logo"></div><div><strong>ESPLink</strong><small>Private remote gaming gateway</small></div></header><div class="eyebrow">Authorization required</div><h1>Enter access code.</h1><p>Use the authorization code provided by the ESPLink owner. Your browser will receive a unique session after successful authorization.</p><form id="form"><label for="code">Authorization code</label><input id="code" type="password" autocomplete="current-password" required autofocus><button id="submit">AUTHORIZE</button><div class="error" id="error"></div></form><div class="note">Your access code is never displayed by the server.</div></main><script>const form=document.getElementById('form'),code=document.getElementById('code'),error=document.getElementById('error'),button=document.getElementById('submit');form.onsubmit=async e=>{e.preventDefault();error.textContent='';button.disabled=true;button.textContent='AUTHORIZING…';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code.value})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Authorization failed');localStorage.setItem('espLinkSession',j.session_id);location.href='/'}catch(err){error.textContent=err.message;code.select();button.disabled=false;button.textContent='AUTHORIZE'}};</script></body></html>
