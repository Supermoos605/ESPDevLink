<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#080a0f"><title>ESPLink · Games</title><script src="/auth.js"></script><style>:root{font-family:Inter,system-ui,sans-serif;color:#f5f7fb;background:#080a0f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 18% 8%,#17213a 0,#0d111b 30%,#080a0f 70%)}.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.22;pointer-events:none}.one{width:260px;height:260px;background:#496cff;top:-100px;right:-60px}.two{width:220px;height:220px;background:#8d4cff;bottom:-100px;left:-70px}.shell{width:min(1050px,100%);margin:auto;padding:24px 18px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#6d7cff,#8d50ff);display:grid;place-items:center}.logo:before{content:"";width:18px;height:18px;border:3px solid white;border-radius:6px}.brand h1{margin:0;font-size:21px}.brand span{color:#7f899c;font-size:12px}.back{color:#b9c1d1;text-decoration:none;border:1px solid #ffffff12;background:#ffffff08;padding:9px 13px;border-radius:999px;font-size:12px}.hero{border:1px solid #ffffff12;background:linear-gradient(145deg,#ffffff0d,#ffffff04);border-radius:28px;padding:30px;box-shadow:0 30px 80px #00000040}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#8995ad}.hero h2{font-size:clamp(30px,6vw,48px);margin:8px 0;letter-spacing:-2px}.hero p{color:#9ca6b8;line-height:1.6;max-width:650px}.host{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding:17px;border:1px solid #ffffff10;background:#07090e99;border-radius:18px}.host strong{display:block}.host small{color:#727d91}.online{color:#52e4a0;font-size:12px}.offline{color:#ff6878}.games{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.game{padding:20px;border:1px solid #ffffff0d;background:#ffffff05;border-radius:18px;transition:.18s}.game-icon{height:130px;border-radius:14px;background:linear-gradient(145deg,#171e31,#0e121c);display:grid;place-items:center;font-size:38px;color:#8995ff}.game h3{margin:15px 0 4px;font-size:16px}.game p{margin:0;color:#727d91;font-size:12px}.play{width:100%;margin-top:16px;padding:13px;border:0;border-radius:13px;background:linear-gradient(135deg,#6476ff,#9257ff);color:white;font-weight:800;cursor:pointer}.play:disabled{opacity:.45;cursor:not-allowed}.selected{outline:2px solid #7886ff66;box-shadow:0 0 30px #6476ff15}.selected:after{content:'SELECTED';display:block;color:#9da8ff;font-size:9px;letter-spacing:1.5px;margin-top:10px}.empty{grid-column:1/-1;padding:35px;text-align:center;color:#7f899c;border:1px dashed #ffffff15;border-radius:18px}.notice{margin-top:12px;color:#ff8795;font-size:11px;min-height:16px}@media(max-width:650px){.shell{padding:16px 12px}.hero{padding:22px 18px}.games{grid-template-columns:1fr}.host{align-items:flex-start;gap:10px}}</style></head><body><div class="orb one"></div><div class="orb two"></div><main class="shell"><header class="top"><div class="brand"><div class="logo"></div><div><h1>ESPLink</h1><span>Remote gaming gateway</span></div></div><a class="back" href="/">← Dashboard</a></header><section class="hero"><div class="eyebrow">Game library</div><h2>Choose what to play.</h2><p>Your selection is remembered by this browser and passed to the streaming screen.</p><div class="host"><div><strong id="hostName">Gaming PC</strong><small id="hostMeta">Checking host…</small></div><div class="online offline" id="hostState">● OFFLINE</div></div><div class="notice" id="notice"></div><div class="games" id="games"><div class="empty">Loading game library…</div></div></section></main><script>const games=[{name:'Steam Library',icon:'▣',desc:'Your installed Steam games'},{name:'Desktop',icon:'⌘',desc:'Stream the Windows desktop'},{name:'Test Stream',icon:'▶',desc:'Development streaming test'}];const selected=()=>localStorage.getItem('espLinkSelectedGame');function render(){const current=selected();document.getElementById('games').innerHTML=games.map((g,i)=>`<article class="game ${g.name===current?'selected':''}"><div class="game-icon">${g.icon}</div><h3>${g.name}</h3><p>${g.desc}</p><button class="play" onclick="requestStream(${i})">PLAY</button></article>`).join('')}async function requestStream(i){const game=games[i].name;localStorage.setItem('espLinkSelectedGame',game);render();const notice=document.getElementById('notice');notice.textContent='Connecting to '+game+'…';try{const r=await fetch('/api/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game,client_id:'browser'})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Connection failed');localStorage.setItem('espLinkHostName',j.pc||'Gaming PC');location.href='/stream.html'}catch(e){notice.textContent=e.message||'Unable to connect. The selection is saved.'}}async function host(){try{const r=await fetch('/api/pc',{cache:'no-store'});if(!r.ok)throw 0;const p=await r.json();const online=!!p.online;document.getElementById('hostName').textContent=p.name||'Gaming PC';document.getElementById('hostMeta').textContent=online?((p.ip||'')+' · '+(p.stream||'Ready')):'Waiting for connection';const el=document.getElementById('hostState');el.textContent=online?'● ONLINE':'● OFFLINE';el.className=online?'online':'online offline'}catch(e){document.getElementById('hostMeta').textContent='Unable to reach ESPLink'}}render();host();setInterval(host,2000);</script></body></html>
