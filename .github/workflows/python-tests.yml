name: Python regression tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  signaling-tests:
    runs-on: ubuntu-latest
    env:
      ESPLINK_AUTH_CODE: ci-test-code
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run WebRTC regression tests
        run: python -m unittest tests/webrtc/test_signaling.py tests/webrtc/test_api.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run reconnect helper test
        run: node tests/webrtc/reconnect-node-test.js
