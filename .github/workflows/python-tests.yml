name: Python regression tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  signaling-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run WebRTC signaling tests
        run: python -m unittest tests/webrtc/test_signaling.py
